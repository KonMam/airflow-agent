[project]
name = "airflow-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "litellm>=1.40",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "streamlit>=1.56.0",
    "plotly>=6.7.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
markers = ["integration: requires Docker (deselect with -m 'not integration')"]
timeout = 120

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
